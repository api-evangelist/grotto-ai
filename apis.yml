name: Grotto AI
description: 'Grotto AI is an AI sales-coaching platform purpose-built for the multifamily
  apartment leasing industry. Founded by former EvolutionIQ leaders Nick Deveau (CEO)
  and Ben Epstein (CTO), Grotto delivers real-time call guidance, tour and call coaching,
  and prospect-lifecycle support across email and text that help leasing agents handle
  objections, book tours, and convert more leads to recover net operating income and
  asset value. The platform works alongside multifamily systems such as Entrata, Funnel,
  and Yardi and is used by operators including Weidner Apartment Homes and Hillpointe.
  Grotto is SOC 2 Type II and ISO 27701 certified and Fair Housing compliant. It is
  backed by ICONIQ. Grotto does not publish a public developer API, SDK, or documentation
  surface; it is a demo-led enterprise SaaS product.'
